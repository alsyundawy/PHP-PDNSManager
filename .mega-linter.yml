# MegaLinter Configuration File
# https://megalinter.io/latest/configuration/
---
# Exclude vendor, generated assets, cache, and third-party libraries
FILTER_REGEX_EXCLUDE: (.*\.min\.(js|css)|vendor/|public/assets/vendor/|public/assets/js/vendor/|public/assets/css/vendor/|public/assets/webfonts/|storage/|coverage/|\.phpunit\.cache/|\.kilo/)

# Disable linters with false positives on technical DNS terms and vendor duplicates
DISABLE:
  - COPYPASTE
  - SPELL

# Disable linters handled by dedicated workflows or conflicting with project standards
DISABLE_LINTERS:
  - REPOSITORY_DEVSKIM
  - JAVASCRIPT_STANDARD

# Link project configuration files
PHP_PHPCS_CONFIG_FILE: phpcs.xml
PHP_PHPSTAN_CONFIG_FILE: phpstan.neon
PHP_PSALM_CONFIG_FILE: psalm.xml

# Output configuration
PRINT_ADDITIONAL_OBJECT_REPORTERS: false
SHOW_ELAPSED_TIME: true
FILE_IO_MULTITHREADING: true
