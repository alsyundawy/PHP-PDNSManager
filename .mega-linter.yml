# MegaLinter Configuration File
# https://megalinter.io/latest/configuration/
---
# Exclude vendor, generated assets, cache, and third-party libraries
FILTER_REGEX_EXCLUDE: (.*\.min\.(js|css)|vendor/|public/assets/vendor/|public/assets/js/vendor/|public/assets/css/vendor/|public/assets/webfonts/|storage/|coverage/|\.phpunit\.cache/|\.kilo/|\.php-cs-fixer\.cache)

# Disable linters with false positives on technical DNS terms and vendor duplicates
DISABLE:
  - COPYPASTE
  - SPELL

# Disable linters handled by dedicated workflows or conflicting with project standards
DISABLE_LINTERS:
  - REPOSITORY_DEVSKIM
  - JAVASCRIPT_STANDARD
  - SQL_TSQLLINT
  - ACTION_ZIZMOR
  - PHP_PHPSTAN
  - PHP_PSALM

# Link project configuration files
PHP_PHPCS_CONFIG_FILE: phpcs.xml
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.yaml

# Output configuration
SHOW_ELAPSED_TIME: true
